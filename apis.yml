aid: gustav
name: Gustav
description: >-
  Gustav is a vendor management platform (VMS) and sub-vendor marketplace for
  the staffing industry, enabling staffing firms to source talent from their
  trusted vendor network, share open jobs, collect and screen candidate
  submissions, run standardized hiring pipelines, schedule interviews, message
  vendors, and track performance in one place. Vendors organize into "Gustav
  Circles" with tiered job-release controls, and candidate submissions sync to
  applicant tracking systems including Bullhorn and JobDiva. Originally a
  Speedinvest-backed startup, Gustav is now operated by the member-owned Fuse
  Cooperative (a Colorado Limited Cooperative Association) and bills itself as
  the staffing industry's largest sub-vendor marketplace. Gustav is a SaaS web
  application; it does not currently publish a public developer API, OpenAPI
  specification, or SDKs — integrations are delivered through the Bullhorn and
  JobDiva marketplaces.
